        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { padding: 14px 20px; font-size: 1em; background-color: #ecf0f1; border: 2px solid #bdc3c7; border-radius: 6px; cursor: pointer; text-align: left; transition: background-color 0.2s, border-color 0.2s; }

        .option-btn.wrong { background-color: #fadbd8; border-color: #e74c3c; color: #c0392b; }
        #feedback-container { margin-top: 25px; padding: 20px; background-color: #fdfefe; border-left: 5px solid #3498db; display: none; line-height: 1.6; overflow-x: auto; }

        th { background-color: #ecf0f1; font-weight: bold; }
        .controls { margin-top: 30px; display: flex; justify-content: space-between; }
        button.action-btn { padding: 10px 20px; font-size: 1em; border: none; border-radius: 6px; cursor: pointer; background-color: #3498db; color: white; font-weight: bold; }
        button.action-btn:hover { background-color: #2980b9; }
        button#end-btn { background-color: #e74c3c; }
        button#end-btn:hover { background-color: #c0392b; }
        #results-screen { text-align: center; display: none; }
        #results-screen h2 { font-size: 2.5em; color: #2c3e50; }

</head>

        {

    let currentQuestionIndex = 0;
    let score = 0;
    let questionsAnswered = 0;
    let randomizedQuestions = [];

    function shuffleArray(array) {
        let shuffled = array.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function startTest() {
        randomizedQuestions = shuffleArray(questionsData);
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= randomizedQuestions.length) {
            endTest();
            return;
        }
        const q = randomizedQuestions[currentQuestionIndex];
        document.getElementById('question-number').innerText = `Question ${currentQuestionIndex + 1} of ${randomizedQuestions.length}`;
        document.getElementById('question-text').innerHTML = q.question;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = ''; 
        q.options.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = optText;
            btn.onclick = () => checkAnswer(index, btn);
            optionsDiv.appendChild(btn);
        });
        document.getElementById('feedback-container').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedIndex, btnElement) {
        const q = randomizedQuestions[currentQuestionIndex];
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);
        if (selectedIndex === q.correctIndex) {
            btnElement.classList.add('correct');
            score++;
        } else {
            btnElement.classList.add('wrong');
            allBtns[q.correctIndex].classList.add('correct');
        }
        questionsAnswered++;
        document.getElementById('score').innerText = score;
        document.getElementById('total-answered').innerText = questionsAnswered;
        const feedbackDiv = document.getElementById('feedback-container');
        feedbackDiv.innerHTML = q.explanation;
        feedbackDiv.style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function endTest() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        let percentage = 0;
        if (questionsAnswered > 0) {
            percentage = Math.round((score / questionsAnswered) * 100);
        }
        document.getElementById('final-total').innerText = questionsAnswered;
        document.getElementById('final-score').innerText = percentage;
    }

    window.onload = startTest;
</script>
