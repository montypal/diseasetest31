            <table>
                <tr><th></th><th>Gnome Hat (+)</th><th>Gnome Hat (-)</th><th>Total</th></tr>
                <tr><td><strong>Test (+)</strong></td><td>250</td><td>150</td><td>400</td></tr>
                <tr><td><strong>Test (-)</strong></td><td>50</td><td>1050</td><td>1100</td></tr>
                <tr style="font-weight: bold;"><td>Total</td><td>300</td><td>1200</td><td>1500</td></tr>
            </table>
            <strong>Calculations:</strong><br>
            • Sensitivity = 250 / 300 = 83.3%<br>
            • Specificity = 1050 / 1200 = 87.5%<br>
            • PPV = 250 / 400 = 62.5%<br>
            • NPV = 1050 / 1100 = 95.5%` 
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let questionsAnswered = 0;
    let randomizedQuestions = [];

    function shuffleArray(array) {
        let shuffled = array.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function startTest() {
        randomizedQuestions = shuffleArray(questionsData);
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= randomizedQuestions.length) {
            endTest();
            return;
        }

        const q = randomizedQuestions[currentQuestionIndex];
        
        document.getElementById('question-number').innerText = `Question ${currentQuestionIndex + 1} of ${randomizedQuestions.length}`;
        document.getElementById('question-text').innerHTML = q.question;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = ''; 
        
        q.options.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = optText;
            btn.onclick = () => checkAnswer(index, btn);
            optionsDiv.appendChild(btn);
        });

        document.getElementById('feedback-container').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedIndex, btnElement) {
        const q = randomizedQuestions[currentQuestionIndex];
        const allBtns = document.querySelectorAll('.option-btn');
        
        allBtns.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.correctIndex) {
            btnElement.classList.add('correct');
            score++;
        } else {
            btnElement.classList.add('wrong');
            allBtns[q.correctIndex].classList.add('correct');
        }

        questionsAnswered++;
        updateScoreBoard();

        const feedbackDiv = document.getElementById('feedback-container');
        feedbackDiv.innerHTML = q.explanation;
        feedbackDiv.style.display = 'block';

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function updateScoreBoard() {
        document.getElementById('score').innerText = score;
        document.getElementById('total-answered').innerText = questionsAnswered;
    }

    function endTest() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        
        let percentage = 0;
        if (questionsAnswered > 0) {
            percentage = Math.round((score / questionsAnswered) * 100);
        }
        
        document.getElementById('final-total').innerText = questionsAnswered;
        document.getElementById('final-score').innerText = percentage;
    }

    window.onload = startTest;
</script>
