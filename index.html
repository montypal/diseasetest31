<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Aria & Dr. Allison's Biostats Exam</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        #app-container {
            background: #fff;
            max-width: 800px;
            width: 100%;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        #score-tracker {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 1.1em;
            font-weight: bold;
            color: #2c3e50;
            background: #eaf2f8;
            padding: 8px 15px;
            border-radius: 20px;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.8em;
            margin-bottom: 5px;
        }
        .question-text {
            font-size: 1.2em;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            padding: 12px 20px;
            font-size: 1em;
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #d5dbdb;
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .option-btn.correct {
            background-color: #d5f5e3;
            border-color: #2ecc71;
            color: #27ae60;
        }
        .option-btn.wrong {
            background-color: #fadbd8;
            border-color: #e74c3c;
            color: #c0392b;
        }
        #feedback-container {
            margin-top: 25px;
            padding: 20px;
            background-color: #fdfefe;
            border-left: 5px solid #3498db;
            display: none;
            line-height: 1.6;
        }
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }
        button.action-btn {
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }
        button.action-btn:hover {
            background-color: #2980b9;
        }
        button#end-btn {
            background-color: #e74c3c;
        }
        button#end-btn:hover {
            background-color: #c0392b;
        }
        #results-screen {
            text-align: center;
            display: none;
        }
        #results-screen h2 {
            font-size: 2.5em;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="score-tracker">Score: <span id="score">0</span> / <span id="total-answered">0</span></div>
    
    <div id="quiz-screen">
        <h1 id="question-number">Question 1</h1>
        <div id="question-text" class="question-text">Loading question...</div>
        
        <div id="options" class="options-container">
            </div>

        <div id="feedback-container">
            </div>

        <div class="controls">
            <button id="end-btn" class="action-btn" onclick="endTest()">End Test Now</button>
            <button id="next-btn" class="action-btn" onclick="nextQuestion()" style="display: none;">Next Question &raquo;</button>
        </div>
    </div>

    <div id="results-screen">
        <h2>Test Complete!</h2>
        <p class="question-text">You answered <span id="final-total">0</span> questions.</p>
        <h3 style="font-size: 2em; color: #2ecc71;">Final Score: <span id="final-score">0</span>%</h3>
        <button class="action-btn" onclick="location.reload()" style="margin-top: 20px;">Restart Test</button>
    </div>
</div>

<script>
    const questionsData = [
        { question: "Dr. Aria tests 500 people for 'Glitter Lung' using the Sparkle-Scan. <br><br>• 100 truly have Glitter Lung.<br>• 400 do not.<br>• Among those with the disease, 80 test positive.<br><br>What is the <strong>Sensitivity</strong> of the Sparkle-Scan?", options: ["80%", "20%", "25%", "75%"], correctIndex: 0, explanation: "<strong>Correct Answer: 80%</strong><br><br>Sensitivity looks ONLY at people who actually have the disease. It is the ability to correctly identify them.<br>• True Positives (TP) = 80<br>• False Negatives (FN) = 20<br>• Formula: TP / (TP + FN) = 80 / 100 = 0.80 or <strong>80%</strong>." },
        { question: "Dr. Allison investigates a 'Yeti Syndrome' outbreak. She develops a Hair-Analyzer test. She tests 200 children:<br><br>• 50 truly have Yeti Syndrome.<br>• 150 do not.<br>• Among those WITHOUT the syndrome, 120 test negative and 30 test positive.<br><br>What is the <strong>Specificity</strong> of the Hair-Analyzer?", options: ["60%", "80%", "25%", "100%"], correctIndex: 1, explanation: "<strong>Correct Answer: 80%</strong><br><br>Specificity looks ONLY at people who do NOT have the disease.<br>• True Negatives (TN) = 120<br>• False Positives (FP) = 30<br>• Formula: TN / (TN + FP) = 120 / 150 = 0.80 or <strong>80%</strong>." },
        { question: "Dr. Aria is using the 'Brain-Hunger Screen' for Zombie Virus. <br><br>• 100 people test positive in total.<br>• Of those 100 positive tests, only 60 actually have the Zombie Virus.<br><br>What is the <strong>Positive Predictive Value (PPV)</strong>?", options: ["40%", "100%", "60%", "Cannot be determined"], correctIndex: 2, explanation: "<strong>Correct Answer: 60%</strong><br><br>PPV answers: 'If I test positive, what are the chances I actually have the disease?'<br>• True Positives (TP) = 60<br>• Total Positive Tests = 100<br>• Formula: TP / Total Positives = 60 / 100 = 0.60 or <strong>60%</strong>." },
        { question: "Dr. Allison conducts a cohort study on eating 'Radioactive Tacos' and developing 'Glowing Teeth'.<br><br>• 100 ate the tacos (Exposed): 40 got glowing teeth.<br>• 200 did not eat tacos (Unexposed): 20 got glowing teeth.<br><br>What is the <strong>Relative Risk (RR)</strong> of getting glowing teeth if you eat the tacos?", options: ["1.5", "2.0", "4.0", "8.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 4.0</strong><br><br>Relative Risk compares the risk in the exposed vs. unexposed.<br>• Risk in Exposed: 40 / 100 = 0.40 (40%)<br>• Risk in Unexposed: 20 / 200 = 0.10 (10%)<br>• Formula: Risk(Exposed) / Risk(Unexposed) = 0.40 / 0.10 = <strong>4.0</strong>." },
        { question: "Dr. Aria does a case-control study on 'Disco Fever'. She looks at 50 Cases and 50 Controls.<br><br>• Cases: 40 wore polyester pants, 10 did not.<br>• Controls: 20 wore polyester pants, 30 did not.<br><br>What is the <strong>Odds Ratio (OR)</strong> for wearing polyester pants and having Disco Fever?", options: ["6.0", "2.0", "4.0", "0.5"], correctIndex: 0, explanation: "<strong>Correct Answer: 6.0</strong><br><br>Odds Ratio compares exposure odds in cases to controls.<br>• Odds of exposure in cases: 40 / 10 = 4.0<br>• Odds of exposure in controls: 20 / 30 = 0.666...<br>• Formula: (40 * 30) / (10 * 20) = 1200 / 200 = <strong>6.0</strong>." },
        { question: "Dr. Aria develops the 'Tickle-Test' for 'Giggle Pox'.<br><br>• 100 children truly have Giggle Pox.<br>• 200 do not.<br>• Of the children who actually have Giggle Pox, 90 test positive.<br><br>What is the <strong>Sensitivity</strong> of the Tickle-Test?", options: ["30%", "45%", "90%", "95%"], correctIndex: 2, explanation: "<strong>Correct Answer: 90%</strong><br><br>• True Positives (TP) = 90<br>• Total with Disease = 100<br>• Formula: TP / Total Sick = 90 / 100 = 0.90 or <strong>90%</strong>." },
        { question: "Dr. Allison uses a 'Noodle-Squeezer' to screen chefs for 'Spaghetti Fingers'.<br><br>• 50 truly have Spaghetti Fingers.<br>• 350 do not.<br>• Among the 350 WITHOUT the condition, 300 test negative.<br><br>What is the <strong>Specificity</strong> of the Noodle-Squeezer?", options: ["75%", "85.7%", "14.3%", "100%"], correctIndex: 1, explanation: "<strong>Correct Answer: 85.7%</strong><br><br>• True Negatives (TN) = 300<br>• Total Healthy = 350<br>• Formula: TN / Total Healthy = 300 / 350 = 0.857 or <strong>85.7%</strong>." },
        { question: "Dr. Aria is combating an outbreak of 'Chronic Yodeling'.<br><br>• 150 people receive a POSITIVE test result.<br>• Only 50 of those actually have Chronic Yodeling.<br><br>What is the <strong>Positive Predictive Value (PPV)</strong>?", options: ["33.3%", "50%", "66.6%", "30%"], correctIndex: 0, explanation: "<strong>Correct Answer: 33.3%</strong><br><br>• True Positives (TP) = 50<br>• Total Positive Tests = 150<br>• Formula: 50 / 150 = 0.333 or <strong>33.3%</strong>." },
        { question: "Dr. Allison is diagnosing 'Sudden Invisibility'.<br><br>• 200 people receive a NEGATIVE test result.<br>• 180 of them truly are NOT invisible, but 20 actually were.<br><br>What is the <strong>Negative Predictive Value (NPV)</strong>?", options: ["10%", "80%", "90%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 90%</strong><br><br>• True Negatives (TN) = 180<br>• Total Negative Tests = 200<br>• Formula: 180 / 200 = 0.90 or <strong>90%</strong>." },
        { question: "Dr. Aria investigates 'Taco Sweats'.<br><br>• Exposed (Lava Sauce): 200 people, 100 got Taco Sweats.<br>• Unexposed (No Lava Sauce): 300 people, 50 got Taco Sweats.<br><br>What is the <strong>Relative Risk (RR)</strong>?", options: ["1.5", "2.0", "3.0", "6.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 3.0</strong><br><br>• Risk(Exposed) = 100 / 200 = 0.50<br>• Risk(Unexposed) = 50 / 300 = 0.166...<br>• Formula: 0.50 / 0.166 = <strong>3.0</strong>." },
        { question: "Dr. Allison conducts a case-control study on 'Neon Sneeze'.<br><br>• 100 Cases: 80 snorted 'Glitter Dust', 20 did not.<br>• 100 Controls: 40 snorted 'Glitter Dust', 60 did not.<br><br>What is the <strong>Odds Ratio (OR)</strong>?", options: ["2.0", "4.0", "6.0", "8.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 6.0</strong><br><br>• Formula: (80 * 60) / (20 * 40) = 4800 / 800 = <strong>6.0</strong>." },
        { question: "Dr. Aria screens 500 patients for 'Jelly Legs'.<br><br>• 100 truly have Jelly Legs, 80 test positive.<br>• 400 are completely healthy, but 40 of them falsely test positive.<br><br>What is the test's <strong>Specificity</strong>?", options: ["80%", "90%", "10%", "20%"], correctIndex: 1, explanation: "<strong>Correct Answer: 90%</strong><br><br>• False Positives = 40<br>• True Negatives = 400 - 40 = 360<br>• Formula: 360 / 400 = 0.90 or <strong>90%</strong>." },
        { question: "Dr. Allison studies 'Glitchy Eye' syndrome.<br><br>• Exposed (>10 hrs screen): 150 gamers, 60 develop Glitchy Eye.<br>• Unexposed (<10 hrs screen): 250 gamers, 25 develop Glitchy Eye.<br><br>What is the <strong>Relative Risk (RR)</strong>?", options: ["2.0", "3.0", "4.0", "5.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 4.0</strong><br><br>• Risk(Exposed) = 60 / 150 = 0.40<br>• Risk(Unexposed) = 25 / 250 = 0.10<br>• Formula: 0.40 / 0.10 = <strong>4.0</strong>." },
        { question: "Dr. Aria investigates 'Socks-with-Sandals Syndrome' (SSS).<br><br>• Cases (80 people): 60 wore Crocs, 20 did not.<br>• Controls (80 people): 20 wore Crocs, 60 did not.<br><br>What is the <strong>Odds Ratio (OR)</strong>?", options: ["3.0", "4.5", "6.0", "9.0"], correctIndex: 3, explanation: "<strong>Correct Answer: 9.0</strong><br><br>• Formula: (60 * 60) / (20 * 20) = 3600 / 400 = <strong>9.0</strong>." },
        { question: "Dr. Allison deals with 'Hiccup-itis'.<br><br>• The test yields 200 POSITIVE results overall.<br>• 40 of those positive results were False Positives.<br><br>What is the <strong>Positive Predictive Value (PPV)</strong>?", options: ["20%", "80%", "100%", "Cannot be determined"], correctIndex: 1, explanation: "<strong>Correct Answer: 80%</strong><br><br>• Total Positives = 200<br>• False Positives = 40, so True Positives = 160.<br>• Formula: 160 / 200 = 0.80 or <strong>80%</strong>." },
        { question: "Dr. Aria tests 200 people for 'Dragon Breath'.<br><br>• 200 people truly have Dragon Breath.<br>• Of those, 150 test positive.<br><br>What is the <strong>Sensitivity</strong>?", options: ["25%", "50%", "75%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 75%</strong><br><br>• Formula: 150 / 200 = 0.75 or <strong>75%</strong>." },
        { question: "Dr. Allison screens 300 gymnasts for 'Rubber Bones'.<br><br>• All 300 do NOT have it.<br>• The test correctly returns negative for 240 of them.<br><br>What is the <strong>Specificity</strong>?", options: ["20%", "80%", "60%", "100%"], correctIndex: 1, explanation: "<strong>Correct Answer: 80%</strong><br><br>• Formula: 240 / 300 = 0.80 or <strong>80%</strong>." },
        { question: "Dr. Aria uses the Stare-Down test for 'Uncontrollable Wink'.<br><br>• The test flags 100 people as POSITIVE.<br>• Only 30 actually have the condition.<br><br>What is the <strong>Positive Predictive Value (PPV)</strong>?", options: ["30%", "70%", "100%", "3.3%"], correctIndex: 0, explanation: "<strong>Correct Answer: 30%</strong><br><br>• Formula: 30 / 100 = 0.30 or <strong>30%</strong>." },
        { question: "Dr. Allison tests for 'Invisible Eyebrows'.<br><br>• 400 people test NEGATIVE.<br>• 380 truly do not have it, 20 actually do.<br><br>What is the <strong>Negative Predictive Value (NPV)</strong>?", options: ["5%", "90%", "95%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 95%</strong><br><br>• Formula: 380 / 400 = 0.95 or <strong>95%</strong>." },
        { question: "Dr. Aria investigates 'Brain Freeze'.<br><br>• Exposed (Chugged): 100 campers, 60 got Brain Freeze.<br>• Unexposed (Sipped): 100 campers, 20 got Brain Freeze.<br><br>What is the <strong>Relative Risk (RR)</strong>?", options: ["2.0", "3.0", "4.0", "6.0"], correctIndex: 1, explanation: "<strong>Correct Answer: 3.0</strong><br><br>• Formula: (60/100) / (20/100) = <strong>3.0</strong>." },
        { question: "Dr. Allison runs a study on 'Leprechaun Ear'.<br><br>• 50 Cases: 40 ate Clovers, 10 did not.<br>• 50 Controls: 10 ate Clovers, 40 did not.<br><br>What is the <strong>Odds Ratio (OR)</strong>?", options: ["4.0", "8.0", "12.0", "16.0"], correctIndex: 3, explanation: "<strong>Correct Answer: 16.0</strong><br><br>• Formula: (40*40) / (10*10) = 1600 / 100 = <strong>16.0</strong>." },
        { question: "Dr. Aria tests 50 vampires for 'Dull Fangs'.<br><br>• All 50 truly have Dull Fangs.<br>• 45 test positive.<br><br>What is the <strong>Sensitivity</strong>?", options: ["90%", "10%", "50%", "100%"], correctIndex: 0, explanation: "<strong>Correct Answer: 90%</strong><br><br>• Formula: 45 / 50 = 0.90 or <strong>90%</strong>." },
        { question: "Dr. Allison tests 500 sailors for 'Mermaid Tail'.<br><br>• None of the 500 have the condition.<br>• 450 test negative.<br><br>What is the <strong>Specificity</strong>?", options: ["10%", "80%", "90%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 90%</strong><br><br>• Formula: 450 / 500 = 0.90 or <strong>90%</strong>." },
        { question: "Dr. Aria tests for 'Werewolf Howl'.<br><br>• She gets 200 POSITIVE results.<br>• Only 50 people actually turn into werewolves.<br><br>What is the <strong>Positive Predictive Value (PPV)</strong>?", options: ["25%", "50%", "75%", "100%"], correctIndex: 0, explanation: "<strong>Correct Answer: 25%</strong><br><br>• Formula: 50 / 200 = 0.25 or <strong>25%</strong>." },
        { question: "Dr. Allison checks for 'Fairy Wings'.<br><br>• 150 test NEGATIVE.<br>• 120 truly don't have wings, but 30 do.<br><br>What is the <strong>Negative Predictive Value (NPV)</strong>?", options: ["20%", "60%", "80%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 80%</strong><br><br>• Formula: 120 / 150 = 0.80 or <strong>80%</strong>." },
        { question: "Dr. Aria studies 'Clown Nose' outbreaks.<br><br>• Exposed (Honked): 200 people, 100 got Clown Nose.<br>• Unexposed (Did not honk): 200 people, 50 got Clown Nose.<br><br>What is the <strong>Relative Risk (RR)</strong>?", options: ["0.5", "1.5", "2.0", "4.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 2.0</strong><br><br>• Formula: (100/200) / (50/200) = <strong>2.0</strong>." },
        { question: "Dr. Allison investigates 'Pirate Peg-Leg'.<br><br>• Cases (100 Pirates): 80 sailed, 20 stayed on land.<br>• Controls (100 Civilians): 40 sailed, 60 stayed on land.<br><br>What is the <strong>Odds Ratio (OR)</strong>?", options: ["2.0", "4.0", "6.0", "8.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 6.0</strong><br><br>• Formula: (80*60) / (20*40) = 4800 / 800 = <strong>6.0</strong>." },
        { question: "Dr. Aria evaluates a test for 'Ghostly Pallor'.<br><br>• She tests 150 genuine ghosts.<br>• The test only comes back positive for 50 of them.<br><br>What is the test's <strong>Sensitivity</strong>?", options: ["25%", "33.3%", "50%", "66.6%"], correctIndex: 1, explanation: "<strong>Correct Answer: 33.3%</strong><br><br>• Formula: 50 / 150 = 0.333 or <strong>33.3%</strong>." },
        { question: "Dr. Allison uses a test for 'Mummy Wrap'.<br><br>• She tests 200 living humans.<br>• 180 test negative, 20 falsely test positive.<br><br>What is the <strong>Specificity</strong>?", options: ["10%", "80%", "90%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 90%</strong><br><br>• Formula: 180 / 200 = 0.90 or <strong>90%</strong>." },
        { question: "Dr. Aria tests for 'Frankenstein Bolts'.<br><br>• The magnet flags 80 people as POSITIVE.<br>• Only 40 actually have bolts.<br><br>What is the <strong>Positive Predictive Value (PPV)</strong>?", options: ["20%", "40%", "50%", "80%"], correctIndex: 2, explanation: "<strong>Correct Answer: 50%</strong><br><br>• Formula: 40 / 80 = 0.50 or <strong>50%</strong>." },
        { question: "Dr. Allison screens for 'Gargoyle Stone' disease.<br><br>• 500 people test NEGATIVE.<br>• 490 are truly fine, 10 are actually turning to stone.<br><br>What is the <strong>Negative Predictive Value (NPV)</strong>?", options: ["2%", "50%", "90%", "98%"], correctIndex: 3, explanation: "<strong>Correct Answer: 98%</strong><br><br>• Formula: 490 / 500 = 0.98 or <strong>98%</strong>." },
        { question: "Dr. Aria tracks 'Sasquatch Feet'.<br><br>• Exposed (Barefoot): 300 people, 150 got Sasquatch Feet.<br>• Unexposed (Boots): 300 people, 30 got Sasquatch Feet.<br><br>What is the <strong>Relative Risk (RR)</strong>?", options: ["3.0", "4.0", "5.0", "10.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 5.0</strong><br><br>• Formula: (150/300) / (30/300) = <strong>5.0</strong>." },
        { question: "Dr. Allison studies 'Chupacabra Spikes'.<br><br>• Cases (80): 60 drank goat milk, 20 did not.<br>• Controls (80): 20 drank goat milk, 60 did not.<br><br>What is the <strong>Odds Ratio (OR)</strong>?", options: ["3.0", "6.0", "9.0", "12.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 9.0</strong><br><br>• Formula: (60*60) / (20*20) = 3600 / 400 = <strong>9.0</strong>." },
        { question: "Dr. Aria tests 10 magical ponies for 'Unicorn Horn'.<br><br>• All 10 truly have the condition.<br>• Her scanner flags all 10 as positive.<br><br>What is the test's <strong>Sensitivity</strong>?", options: ["0%", "50%", "90%", "100%"], correctIndex: 3, explanation: "<strong>Correct Answer: 100%</strong><br><br>• Formula: 10 / 10 = 1.0 or <strong>100%</strong>." },
        { question: "Dr. Allison tests 1000 knights for 'Dragon Scales'.<br><br>• None have the condition.<br>• 950 test negative, 50 false positives.<br><br>What is the test's <strong>Specificity</strong>?", options: ["5%", "50%", "95%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 95%</strong><br><br>• Formula: 950 / 1000 = 0.95 or <strong>95%</strong>." },
        { question: "Dr. Aria screens for 'Spontaneous Levitation'.<br><br>• 100 people truly have the condition.<br>• 80 of them test positive.<br><br>What is the <strong>Sensitivity</strong>?", options: ["20%", "40%", "80%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 80%</strong><br><br>• Formula: 80 / 100 = 0.80 or <strong>80%</strong>." },

        { question: "Dr. Aria tracks 'Lava Burps'.<br><br>• Exposed: 100 people, 80 got sick.<br>• Unexposed: 200 people, 20 got sick.<br><br>What is the <strong>Relative Risk (RR)</strong>?", options: ["2.0", "4.0", "6.0", "8.0"], correctIndex: 3, explanation: "<strong>Correct Answer: 8.0</strong><br><br>• Formula: (80/100) / (20/200) = <strong>8.0</strong>." },
        { question: "Dr. Allison conducts a study on 'Glitter Dandruff'.<br><br>• Cases (100): 90 rolled in Fairy Dust, 10 did not.<br>• Controls (100): 30 rolled in Fairy Dust, 70 did not.<br><br>What is the <strong>Odds Ratio (OR)</strong>?", options: ["10.0", "15.0", "21.0", "25.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 21.0</strong><br><br>• Formula: (90*70) / (10*30) = 6300 / 300 = <strong>21.0</strong>." },
        { question: "Dr. Aria uses a Spring-Scale for 'Bouncy Hair'.<br><br>• 40 people truly have Bouncy Hair.<br>• The test correctly flags 10 as positive.<br><br>What is the <strong>Sensitivity</strong>?", options: ["10%", "25%", "50%", "75%"], correctIndex: 1, explanation: "<strong>Correct Answer: 25%</strong><br><br>• Formula: 10 / 40 = 0.25 or <strong>25%</strong>." },
        { question: "Dr. Allison tests for 'Robot Voice'.<br><br>• She tests 500 normal humans.<br>• 400 test negative, 100 falsely test positive.<br><br>What is the <strong>Specificity</strong>?", options: ["20%", "60%", "80%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 80%</strong><br><br>• Formula: 400 / 500 = 0.80 or <strong>80%</strong>." },
        { question: "Dr. Aria checks for 'Unicorn Flu'.<br><br>• The swab flags 80 people as POSITIVE.<br>• Half of them (40) actually have Unicorn Flu.<br><br>What is the <strong>Positive Predictive Value (PPV)</strong>?", options: ["20%", "40%", "50%", "80%"], correctIndex: 2, explanation: "<strong>Correct Answer: 50%</strong><br><br>• Formula: 40 / 80 = 0.50 or <strong>50%</strong>." },
        { question: "Dr. Allison screens for 'Zombie Shuffle'.<br><br>• 1000 test NEGATIVE.<br>• 990 are truly fine, but 10 are zombies.<br><br>What is the <strong>Negative Predictive Value (NPV)</strong>?", options: ["1%", "90%", "99%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 99%</strong><br><br>• Formula: 990 / 1000 = 0.99 or <strong>99%</strong>." },
        { question: "Dr. Aria tracks 'Neon Sweat'.<br><br>• Exposed: 50 people, 25 got sick.<br>• Unexposed: 150 people, 15 got sick.<br><br>What is the <strong>Relative Risk (RR)</strong>?", options: ["2.0", "3.0", "5.0", "10.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 5.0</strong><br><br>• Formula: (25/50) / (15/150) = <strong>5.0</strong>." },
        { question: "Dr. Allison investigates 'Pirate Eye'.<br><br>• Cases (50): 40 wore eyepatch, 10 did not.<br>• Controls (50): 10 wore eyepatch, 40 did not.<br><br>What is the <strong>Odds Ratio (OR)</strong>?", options: ["4.0", "8.0", "16.0", "32.0"], correctIndex: 2, explanation: "<strong>Correct Answer: 16.0</strong><br><br>• Formula: (40*40) / (10*10) = 1600 / 100 = <strong>16.0</strong>." },
        { question: "Dr. Aria screens for 'Gargoyle Breath'.<br><br>• 200 people truly have the condition.<br>• Her test correctly identifies 190 of them.<br><br>What is the <strong>Sensitivity</strong>?", options: ["10%", "50%", "90%", "95%"], correctIndex: 3, explanation: "<strong>Correct Answer: 95%</strong><br><br>• Formula: 190 / 200 = 0.95 or <strong>95%</strong>." },
        { question: "Dr. Allison tests for 'Mermaid Scales'.<br><br>• She tests 100 perfectly healthy people.<br>• 10 falsely test positive, 90 test negative.<br><br>What is the <strong>Specificity</strong>?", options: ["10%", "80%", "90%", "100%"], correctIndex: 2, explanation: "<strong>Correct Answer: 90%</strong><br><br>• Formula: 90 / 100 = 0.90 or <strong>90%</strong>." },
        { question: "Dr. Aria looks into 'Hiccup-Mania'.<br><br>• Exposed: 400 people, 100 got Hiccup-Mania.<br>• Unexposed: 400 people, 20 got Hiccup-Mania.<br><br>What is the <strong>Relative Risk (RR)</strong>?", options: ["2.0", "3.0", "4.0", "5.0"], correctIndex: 3, explanation: "<strong>Correct Answer: 5.0</strong><br><br>• Formula: (100/400) / (20/400) = <strong>5.0</strong>." }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let questionsAnswered = 0;
    let randomizedQuestions = [];

    function shuffleArray(array) {
        let shuffled = array.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function startTest() {
        randomizedQuestions = shuffleArray(questionsData);
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= randomizedQuestions.length) {
            endTest();
            return;
        }

        const q = randomizedQuestions[currentQuestionIndex];
        
        document.getElementById('question-number').innerText = `Question ${currentQuestionIndex + 1} of ${randomizedQuestions.length}`;
        document.getElementById('question-text').innerHTML = q.question;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = ''; 
        
        q.options.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = optText;
            btn.onclick = () => checkAnswer(index, btn);
            optionsDiv.appendChild(btn);
        });

        document.getElementById('feedback-container').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedIndex, btnElement) {
        const q = randomizedQuestions[currentQuestionIndex];
        const allBtns = document.querySelectorAll('.option-btn');
        
        allBtns.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.correctIndex) {
            btnElement.classList.add('correct');
            score++;
        } else {
            btnElement.classList.add('wrong');
            allBtns[q.correctIndex].classList.add('correct');
        }

        questionsAnswered++;
        updateScoreBoard();

        const feedbackDiv = document.getElementById('feedback-container');
        feedbackDiv.innerHTML = q.explanation;
        feedbackDiv.style.display = 'block';

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function updateScoreBoard() {
        document.getElementById('score').innerText = score;
        document.getElementById('total-answered').innerText = questionsAnswered;
    }

    function endTest() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        
        let percentage = 0;
        if (questionsAnswered > 0) {
            percentage = Math.round((score / questionsAnswered) * 100);
        }
        
        document.getElementById('final-total').innerText = questionsAnswered;
        document.getElementById('final-score').innerText = percentage;
    }

    window.onload = startTest;
</script>

</body>
</html>
